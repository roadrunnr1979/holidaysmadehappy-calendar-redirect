<script>
fetch('events.json')
  .then(res => {
    if (!res.ok) throw new Error('Fetch failed: ' + res.status);
    return res.json();
  })
  .then(events => {
    events.forEach(e => e.date = new Date(e.date));
    render(events);
  })
  .catch(err => {
    document.getElementById('events').innerHTML =
      `<div class="error">Couldn't load events (${err.message}). Try refreshing in a bit.</div>`;
    console.error(err);
  });

function render(events) {
  const container = document.getElementById('events');
  const now = new Date();
  now.setHours(0,0,0,0);

  const upcoming = events
    .filter(e => e.date >= now)
    .sort((a, b) => a.date - b.date);

  if (upcoming.length === 0) {
    container.innerHTML = '<div class="empty">No upcoming events right now — check back soon!</div>';
    return;
  }

  const dateFmt = { weekday: 'long', month: 'long', day: 'numeric' };

  container.innerHTML = upcoming.map(e => `
    <div class="event">
      <div class="event-date">${e.date.toLocaleDateString('en-US', dateFmt)}</div>
      <div class="event-title">${e.title}</div>
      ${e.location ? `<div class="event-location">📍 ${e.location}</div>` : ''}
      ${e.description ? `<div class="event-desc">${e.description}</div>` : ''}
    </div>
  `).join('');
}
</script>
