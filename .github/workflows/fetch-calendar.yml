name: Fetch Calendar

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ICS and convert to JSON
        run: |
          curl -sL "https://p128-caldav.icloud.com/published/2/MTA1NzA1OTI0MTA1NzA1OYTeWAfFJynuP-K5_aiDPwQQg64T2mPF-DJSK-q8euY4NezAhAUl3oM2RNaFLdUntKQKAW3djfvT73MZ7nzUxsA" -o calendar.ics
          python3 parse_ics.py calendar.ics events.json

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Update events.json [skip ci]"
          git push
